name: Release Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Post the APK to the Telegram channel'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Gradle Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      build_timestamp: ${{ steps.release_build_step.outputs.build_timestamp }}
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_HARDLINK: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "2G"
      NATIVE_TARGET: "universal"
      # CMake 4 больше не принимает cmake_minimum_required < 3.5 (рантайм Chaquopy)
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      TG_ENABLED: ${{ (github.event_name != 'workflow_dispatch' || inputs.publish) && !contains(github.event.head_commit.message, '[skip publish]') }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive
      - name: "Telegram: старт"
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message || 'ручной запуск' }}
        run: TG_NOTE="$COMMIT_MSG" bash .github/scripts/tg_step.sh step "Старт" "🚀 <b>Сборка началась</b> (1/5)"
      - name: Pin native submodules to exteraless 13.1.1
        run: |
          set -euo pipefail
          pin() {
            if [ "$(git -C "$1" rev-parse HEAD)" = "$2" ]; then echo "$1 already at $2"; return; fi
            git -C "$1" fetch --quiet --depth=1 origin "$2"
            git -C "$1" checkout --quiet --force --detach FETCH_HEAD
            git -C "$1" submodule update --init --recursive --depth=1
            echo "$1 -> $2"
          }
          pin TMessagesProj/jni/third_party/absl 54fac219c4ef0bc379dfffb0b8098725d77ac81b
          pin TMessagesProj/jni/third_party/boost-regex 4cbcd3078e6ae10d05124379623a1bf03fcb9350
          pin TMessagesProj/jni/third_party/dav1d 54706fc6bc0cdecab7e9593974a4039cc038fca7
          pin TMessagesProj/jni/third_party/libprisma 31a5d6fbbef8136e4a2b3adaf7b95e2ccaa7436d
          pin TMessagesProj/jni/third_party/libvpx 1024874c5919305883187e2953de8fcb4c3d7fa6
          pin TMessagesProj/jni/third_party/wamr 25bd7eb63e828e4bd242cc9b38d260b4b31c6605
          pin TMessagesProj/jni/third_party/xiph/ogg be05b13e98b048f0b5a0f5fa8ce514d56db5f822
          pin TMessagesProj/jni/third_party/xiph/opus 22244de5a79bd1d6d623c32e72bf1954b56235be
          pin TMessagesProj/jni/third_party/xiph/opusfile a55c164e9891a9326188b7d4d216ec9a88373739
          pin TMessagesProj/jni/tlottie 31f1b542f88e7b4be9a01e749920d857535fc715
      - name: "Telegram: инструменты"
        run: bash .github/scripts/tg_step.sh step "Установка инструментов" "🧰 Библиотеки подогнаны, ставлю JDK, Android SDK и NDK (2/5)"
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Python for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Point Chaquopy at that Python
        run: echo "CHAQUOPY_BUILD_PYTHON=$(which python3.11 || which python)" >> $GITHUB_ENV
      - name: Set up Ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: android-ndk
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Set up Android SDK Tools
        uses: android-actions/setup-android@v4
        with:
          packages: "build-tools;36.0.0 ndk;27.2.12479018 platforms;android-37.0"
      - name: Install Native Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes nasm
      - name: Configure Android SDK Path
        run: |
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties
      - name: Modify Gradle JVM Args
        run: |
          sed -i '/^org\.gradle\.java\.home=/d' gradle.properties
          MEMORY_KB=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          MEMORY_GB=$((MEMORY_KB / 1024 / 1024))
          echo "Detected memory size: ${MEMORY_GB}GB"
          if [ $MEMORY_GB -ge 12 ]; then
            sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties
            echo "org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          fi
          cat gradle.properties
      - name: Restore signing key
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          if [ -n "$RELEASE_KEYSTORE" ]; then
            echo "$RELEASE_KEYSTORE" | base64 -d > TMessagesProj/release.keystore
            echo "signing key restored"
          else
            echo "RELEASE_KEYSTORE не задан — сборка подпишется отладочным ключом"
          fi
      - name: "Telegram: компиляция"
        run: bash .github/scripts/tg_step.sh step "Компиляция" "🔨 <b>Компилирую</b> (3/5) — самый долгий этап"
      - name: Release Build
        id: release_build_step
        env:
          COMMIT_ID: ${{ github.event.head_commit.id || github.sha }}
        run: |
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          export BUILD_TIMESTAMP=$(date +%s)
          echo "build_timestamp=$BUILD_TIMESTAMP" >> "$GITHUB_OUTPUT"
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew TMessagesProj:assembleRelease 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: "Telegram: APK собран"
        run: |
          APK=$(ls -1t TMessagesProj/build/outputs/apk/release/*.apk | head -n 1)
          SIZE=$(du -m "$APK" | cut -f1)
          bash .github/scripts/tg_step.sh step "Публикация" "✅ <b>APK собран</b> (${SIZE} МБ), публикую (4/5)"
      - name: Upload arm64-v8a Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Release
          path: |
            TMessagesProj/build/outputs/apk/release/*.apk
      - name: Publish GitHub pre-release
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.publish) && !contains(github.event.head_commit.message, '[skip publish]') }}
        env:
          GH_TOKEN: ${{ github.token }}
          COMMITS_JSON: ${{ toJSON(github.event.commits) }}
        run: |
          SHORT=$(echo "$GITHUB_SHA" | cut -c1-7)
          TAG="ci-$SHORT"
          NOTES=$(echo "$COMMITS_JSON" | jq -r 'if type == "array" then map("• " + (.message | split("\n")[0])) | join("\n") else "" end')
          if [ -z "$NOTES" ]; then
            NOTES="CI build $SHORT"
          fi
          gh release create "$TAG" TMessagesProj/build/outputs/apk/release/*.apk \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "exteraless CI $SHORT" --notes "$NOTES"
          gh release list --limit 100 --json tagName,isPrerelease,createdAt \
            -q '[.[] | select(.isPrerelease and (.tagName | startswith("ci-")))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
            while read -r old; do
              gh release delete "$old" --yes --cleanup-tag
            done
      - name: Send APK to Telegram
        continue-on-error: true
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.publish) && !contains(github.event.head_commit.message, '[skip publish]') }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMITS_JSON: ${{ toJSON(github.event.commits) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_API_ID" ] || [ -z "$TG_API_HASH" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "секреты Telegram не заданы — отправка пропущена"
            exit 0
          fi
          pip install --quiet kurigram tgcrypto
          python3 .github/scripts/send_apk.py
      - name: "Telegram: готово"
        env:
          RELEASES_URL: ${{ github.server_url }}/${{ github.repository }}/releases
        run: |
          SHORT=$(echo "$GITHUB_SHA" | cut -c1-7)
          bash .github/scripts/tg_step.sh final "🎉 <b>Готово!</b> (5/5) APK: <a href=\"$RELEASES_URL/tag/ci-$SHORT\">ci-$SHORT</a>"
      - name: "Telegram: сборка упала"
        if: failure()
        run: bash .github/scripts/tg_step.sh fail "$RUNNER_TEMP/build.log"
      - name: "Telegram: сборка отменена"
        if: cancelled()
        run: bash .github/scripts/tg_step.sh step "Отмена" "⏹ Сборка отменена — запущена более новая"
